<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </radialGradient>
    <linearGradient id="neonRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d49266" />
      <stop offset="100%" stop-color="#b67246" />
    </linearGradient>
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e38" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="glassesGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background circle with dark tech glow -->
  <circle cx="200" cy="200" r="195" fill="url(#bgGlow)" />
  
  <!-- Outer glowing tech orbital rings -->
  <circle cx="200" cy="200" r="190" fill="none" stroke="url(#neonRing)" stroke-width="3" stroke-dasharray="12 6" opacity="0.6" />
  <circle cx="200" cy="200" r="175" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.2" />

  <!-- Code ambient decorations -->
  <text x="35" y="100" font-family="'JetBrains Mono', monospace" font-size="14" fill="#38bdf8" opacity="0.4">&lt;developer&gt;</text>
  <text x="270" y="320" font-family="'JetBrains Mono', monospace" font-size="14" fill="#a855f7" opacity="0.4">&lt;/code&gt;</text>
  <text x="300" y="130" font-family="'JetBrains Mono', monospace" font-size="12" fill="#34d399" opacity="0.35">React + Django</text>
  <text x="40" y="300" font-family="'JetBrains Mono', monospace" font-size="12" fill="#6366f1" opacity="0.35">REST API / AI</text>

  <!-- Developer Silhouette / Character Representation -->
  <g transform="translate(0, 10)">
    <!-- Shoulders & Hoodie -->
    <path d="M90 380 C90 300, 140 270, 200 270 C260 270, 310 300, 310 380 Z" fill="url(#hoodieGrad)" stroke="#334155" stroke-width="2" />
    <path d="M160 275 L200 330 L240 275 Z" fill="#090d16" opacity="0.8" />
    <path d="M190 280 L200 380 L210 280" stroke="#38bdf8" stroke-width="2" opacity="0.5" />
    
    <!-- Neck -->
    <rect x="175" y="220" width="50" height="60" rx="10" fill="#b67246" />

    <!-- Head / Face -->
    <ellipse cx="200" cy="180" rx="55" ry="65" fill="url(#faceGrad)" />

    <!-- Modern Haircut -->
    <path d="M142 165 C140 115, 170 100, 200 100 C235 100, 260 115, 258 165 C250 135, 230 115, 200 118 C170 115, 150 135, 142 165 Z" fill="#18181b" />
    <path d="M140 170 C140 130, 160 105, 200 105 C240 105, 260 130, 260 170 C258 140, 240 120, 200 120 C160 120, 142 140, 140 170 Z" fill="#27272a" />

    <!-- Smart Developer Glasses -->
    <rect x="156" y="160" width="36" height="26" rx="8" fill="none" stroke="url(#glassesGrad)" stroke-width="3.5" filter="url(#glowFilter)" />
    <rect x="208" y="160" width="36" height="26" rx="8" fill="none" stroke="url(#glassesGrad)" stroke-width="3.5" filter="url(#glowFilter)" />
    <line x1="192" y1="172" x2="208" y2="172" stroke="url(#glassesGrad)" stroke-width="3.5" />
    <line x1="145" y1="168" x2="156" y2="170" stroke="url(#glassesGrad)" stroke-width="3" />
    <line x1="244" y1="170" x2="255" y2="168" stroke="url(#glassesGrad)" stroke-width="3" />

    <!-- Eyes (behind glasses lens reflections) -->
    <circle cx="174" cy="173" r="3.5" fill="#18181b" />
    <circle cx="226" cy="173" r="3.5" fill="#18181b" />
    <ellipse cx="168" cy="168" rx="4" ry="2" fill="#ffffff" opacity="0.6" />
    <ellipse cx="220" cy="168" rx="4" ry="2" fill="#ffffff" opacity="0.6" />

    <!-- Eyebrows -->
    <path d="M156 150 Q174 146 190 152" stroke="#18181b" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <path d="M210 152 Q226 146 244 150" stroke="#18181b" stroke-width="3.5" stroke-linecap="round" fill="none" />

    <!-- Nose & Smile -->
    <path d="M197 182 Q200 196 204 196 Q206 196 204 198" stroke="#8c4e24" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M184 212 Q200 224 216 212" stroke="#5c2c10" stroke-width="3.5" stroke-linecap="round" fill="none" />
  </g>

  <!-- Glowing Status Indicator Dot (Active Developer Badge) -->
  <circle cx="310" cy="90" r="16" fill="#0f172a" stroke="#334155" stroke-width="2" />
  <circle cx="310" cy="90" r="7" fill="#10b981" />
  <circle cx="310" cy="90" r="11" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.6" />
</svg>
